<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>人格大陆 · Persona Realm</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: 'ZCOOL XiaoWei', 'Microsoft YaHei', serif;
    background: #1a1410;
    color: #f4e8d0;
    user-select: none;
  }

  /* ====== 地图容器 ====== */
  #map-wrapper {
    position: absolute; inset: 0;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 30% 20%, #5d7a8a 0%, transparent 40%),
      radial-gradient(ellipse at 70% 80%, #3a5568 0%, transparent 50%),
      linear-gradient(180deg, #2a3d4a 0%, #1e2d38 100%);
  }
  /* 让 SVG 自适应填满整个容器，无需滚动和拖动 */
  #map-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ====== 顶部标题栏 ====== */
  .top-bar {
    position: absolute;
    top: 24px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    text-align: center;
    pointer-events: none;
  }
  .top-bar h1 {
    font-family: 'Cinzel', serif;
    font-size: 28px;
    letter-spacing: 8px;
    color: #f4e8d0;
    text-shadow:
      0 0 20px rgba(255, 220, 150, 0.6),
      0 2px 4px rgba(0,0,0,0.8);
  }
  .top-bar .subtitle {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 16px;
    color: #d4b98c;
    margin-top: 6px;
    letter-spacing: 4px;
  }

  /* ====== 进度指示器 ====== */
  .progress-panel {
    position: absolute;
    top: 24px; right: 24px;
    z-index: 10;
    background: linear-gradient(135deg, rgba(40,30,20,0.9), rgba(20,15,10,0.9));
    border: 2px solid #8b6f47;
    border-radius: 8px;
    padding: 12px 18px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 0 20px rgba(139,111,71,0.2);
    min-width: 200px;
  }
  .progress-panel .label {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: #d4b98c;
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 8px;
    background: rgba(0,0,0,0.5);
    border: 1px solid #6b5537;
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #c9a961, #ffd98a, #c9a961);
    background-size: 200% 100%;
    animation: shimmer 3s linear infinite;
    width: 0%;
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 10px rgba(255, 217, 138, 0.6);
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .progress-text {
    text-align: right;
    font-size: 13px;
    color: #f4e8d0;
    margin-top: 4px;
    font-family: 'Cinzel', serif;
    letter-spacing: 2px;
  }

  /* ====== 左下角操作提示 ====== */
  .hint-panel {
    position: absolute;
    bottom: 20px; left: 20px;
    z-index: 10;
    background: rgba(20,15,10,0.75);
    border: 1px solid #6b5537;
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 13px;
    color: #d4b98c;
    backdrop-filter: blur(4px);
  }
  .hint-panel span { color: #ffd98a; margin: 0 4px; }

  /* ====== 地图区域标签 ====== */
  .region-label {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 22px;
    fill: #fff5e0;
    opacity: 0.9;
    letter-spacing: 5px;
    pointer-events: none;
    paint-order: stroke;
    stroke: rgba(20,10,0,0.8);
    stroke-width: 4;
    stroke-linejoin: round;
  }
  .region-label-en {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    fill: #ffd98a;
    opacity: 0.75;
    letter-spacing: 3px;
    pointer-events: none;
    paint-order: stroke;
    stroke: rgba(20,10,0,0.7);
    stroke-width: 2.5;
    stroke-linejoin: round;
  }

  /* ====== 地点图标 ====== */
  .poi {
    cursor: pointer;
  }
  /* 悬停缩放作用在子元素上，避免覆盖 <g> 的 translate 导致抖动 */
  .poi .poi-bg,
  .poi .poi-icon,
  .poi .poi-pulse {
    transition: transform 0.2s ease-out;
    transform-origin: center;
    transform-box: fill-box;
  }
  .poi:hover .poi-bg { transform: scale(1.15); }
  .poi:hover .poi-icon { transform: scale(1.15); }
  .poi-pulse {
    animation: pulse 2.5s ease-out infinite;
    transform-origin: center;
    transform-box: fill-box;
  }
  @keyframes pulse {
    0%   { opacity: 0.6; transform: scale(1); }
    50%  { opacity: 0; transform: scale(2.2); }
    100% { opacity: 0; transform: scale(2.2); }
  }

  .poi-locked circle.poi-bg { fill: #2a2018; stroke: #5d4a30; }
  .poi-locked text.poi-icon { opacity: 0.3; filter: grayscale(1); }
  .poi-locked text.poi-name { opacity: 0.4; }

  .poi-bg {
    fill: url(#poiGradient);
    stroke: #c9a961;
    stroke-width: 2;
    filter: drop-shadow(0 0 6px rgba(255, 217, 138, 0.8));
  }
  .poi-icon {
    font-size: 18px;
    text-anchor: middle;
    dominant-baseline: central;
  }
  .poi-name {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 11px;
    fill: #fff5e0;
    text-anchor: middle;
    paint-order: stroke;
    stroke: #1a1008;
    stroke-width: 3;
    stroke-linejoin: round;
  }

  /* 迷雾 */
  .fog {
    fill: url(#fogGradient);
    pointer-events: none;
    transition: opacity 1.2s ease-out;
  }
  .fog.cleared { opacity: 0; }

  /* ====== 详情弹窗 ====== */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(10, 8, 6, 0.75);
    backdrop-filter: blur(6px);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .modal-backdrop.show {
    opacity: 1;
    pointer-events: auto;
  }
  .modal {
    background: linear-gradient(145deg, #2d2418 0%, #1a1410 100%);
    border: 2px solid #8b6f47;
    border-radius: 12px;
    width: min(560px, 90vw);
    max-height: 80vh;
    overflow-y: auto;
    padding: 32px 36px;
    position: relative;
    transform: scale(0.9) translateY(20px);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow:
      0 20px 60px rgba(0,0,0,0.7),
      0 0 40px rgba(255, 217, 138, 0.2),
      inset 0 0 30px rgba(139,111,71,0.15);
  }
  .modal-backdrop.show .modal {
    transform: scale(1) translateY(0);
  }
  .modal::before {
    content: '';
    position: absolute;
    top: 8px; left: 8px; right: 8px; bottom: 8px;
    border: 1px solid rgba(201, 169, 97, 0.3);
    border-radius: 8px;
    pointer-events: none;
  }
  .modal-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 32px; height: 32px;
    background: transparent;
    border: 1px solid #8b6f47;
    border-radius: 50%;
    color: #d4b98c;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .modal-close:hover {
    background: #8b6f47;
    color: #1a1410;
    transform: rotate(90deg);
  }

  .modal-header {
    display: flex; align-items: center;
    gap: 16px;
    padding-bottom: 18px;
    border-bottom: 1px solid rgba(201, 169, 97, 0.3);
  }
  .modal-icon {
    width: 64px; height: 64px;
    background: radial-gradient(circle, #3d2f20, #1a1410);
    border: 2px solid #c9a961;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px;
    box-shadow: 0 0 20px rgba(255, 217, 138, 0.4);
    flex-shrink: 0;
  }
  .modal-title {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 26px;
    color: #f4e8d0;
    letter-spacing: 3px;
  }
  .modal-subtitle {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    color: #d4b98c;
    letter-spacing: 4px;
    margin-top: 4px;
    opacity: 0.8;
  }

  .modal-body {
    padding-top: 20px;
    font-size: 15px;
    line-height: 1.8;
    color: #e8d8b8;
  }
  .modal-body p { margin-bottom: 12px; }
  .modal-body h4 {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 18px;
    color: #ffd98a;
    margin: 18px 0 10px;
    letter-spacing: 2px;
    display: flex; align-items: center; gap: 8px;
  }
  .modal-body h4::before {
    content: '❖'; color: #c9a961;
  }
  .modal-body ul { list-style: none; padding: 0; }
  .modal-body li {
    padding: 8px 14px;
    margin-bottom: 6px;
    background: rgba(139, 111, 71, 0.12);
    border-left: 3px solid #c9a961;
    border-radius: 0 6px 6px 0;
    transition: all 0.2s;
  }
  .modal-body li:hover {
    background: rgba(139, 111, 71, 0.25);
    transform: translateX(4px);
  }
  .tag-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .tag {
    padding: 4px 12px;
    background: rgba(201, 169, 97, 0.15);
    border: 1px solid #8b6f47;
    border-radius: 16px;
    font-size: 13px;
    color: #ffd98a;
  }

  /* ====== 解锁动画 ====== */
  @keyframes unlockBurst {
    0%   { r: 20; opacity: 0.9; stroke-width: 2.5; }
    100% { r: 80; opacity: 0; stroke-width: 0.5; }
  }
  .unlock-burst {
    fill: none;
    stroke: #ffd98a;
    pointer-events: none;
    animation: unlockBurst 1s ease-out forwards;
  }

  /* 成就解锁提示 */
  .achievement-toast {
    position: fixed;
    top: 80px; left: 50%;
    transform: translateX(-50%) translateY(-40px);
    z-index: 200;
    background: linear-gradient(135deg, #3d2f20, #1a1410);
    border: 2px solid #ffd98a;
    border-radius: 8px;
    padding: 14px 28px;
    display: flex; align-items: center; gap: 14px;
    opacity: 0;
    transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 30px rgba(255, 217, 138, 0.6);
    pointer-events: none;
  }
  .achievement-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .achievement-toast .ach-icon {
    font-size: 28px;
    animation: ach-spin 2s ease-in-out infinite;
  }
  @keyframes ach-spin {
    0%, 100% { transform: rotate(-8deg); }
    50%      { transform: rotate(8deg); }
  }
  .achievement-toast .ach-label {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    color: #d4b98c;
    letter-spacing: 3px;
  }
  .achievement-toast .ach-name {
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 18px;
    color: #ffd98a;
    letter-spacing: 2px;
  }

  /* 进场动画 */
  #loading {
    position: fixed; inset: 0;
    background: #1a1410;
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    gap: 20px;
    transition: opacity 0.8s;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  #loading h2 {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    color: #d4b98c;
    letter-spacing: 8px;
    animation: fadeInOut 2s ease-in-out infinite;
  }
  @keyframes fadeInOut {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 1; }
  }

  /* 滚动条 */
  .modal::-webkit-scrollbar { width: 6px; }
  .modal::-webkit-scrollbar-track { background: transparent; }
  .modal::-webkit-scrollbar-thumb { background: #8b6f47; border-radius: 3px; }
</style>
</head>

    <!-- ====== 区域标签（浮于底图之上） ====== -->

      <text x="300" y="195" class="region-label-en" text-anchor="middle">PEAKS OF CHARACTER</text>

      <text x="1200" y="895" class="region-label-en" text-anchor="middle">SEA OF MEMORY</text>

    <!-- ====== POI 容器（动态注入） ====== -->
    <g id="pois"></g>

    <!-- ====== 迷雾层（覆盖未解锁区域） ====== -->
    <g id="fog-layer"></g>
  </svg>
</div>

<!-- 详情弹窗 -->
<div class="modal-backdrop" id="modalBackdrop">

    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-header">

    </div>
    <div class="modal-body" id="modalBody"></div>

</div>

<!-- 成就解锁提示 -->

/* =========================================================
   渲染逻辑
   ========================================================= */
const SVG_NS = 'http://www.w3.org/2000/svg';
const poisGroup = document.getElementById('pois');
const fogGroup  = document.getElementById('fog-layer');
const unlockedSet = new Set();

// 渲染每个 POI
DATA.forEach(item => {
  const g = document.createElementNS(SVG_NS, 'g');
  g.setAttribute('class', 'poi poi-locked');
  g.setAttribute('id', `poi-${item.id}`);
  g.setAttribute('transform', `translate(${item.x}, ${item.y})`);
  g.dataset.id = item.id;

  // 外圈脉冲（仅解锁后可见）
  const pulse = document.createElementNS(SVG_NS, 'circle');
  pulse.setAttribute('r', '20');
  pulse.setAttribute('fill', 'none');
  pulse.setAttribute('stroke', '#ffd98a');
  pulse.setAttribute('stroke-width', '1.5');
  pulse.setAttribute('class', 'poi-pulse');
  pulse.style.display = 'none';
  g.appendChild(pulse);

  // 底圆
  const bg = document.createElementNS(SVG_NS, 'circle');
  bg.setAttribute('r', '18');
  bg.setAttribute('class', 'poi-bg');
  g.appendChild(bg);

  // 图标
  const icon = document.createElementNS(SVG_NS, 'text');
  icon.setAttribute('class', 'poi-icon');
  icon.setAttribute('y', '1');
  icon.textContent = item.icon;
  g.appendChild(icon);

  // 名称
  const name = document.createElementNS(SVG_NS, 'text');
  name.setAttribute('class', 'poi-name');
  name.setAttribute('y', '36');
  name.textContent = item.name;
  g.appendChild(name);

  g.addEventListener('click', (e) => {
    e.stopPropagation();
    onPoiClick(item);
  });

  poisGroup.appendChild(g);

  // 迷雾（覆盖在 POI 附近的区域）
  const fog = document.createElementNS(SVG_NS, 'circle');
  fog.setAttribute('cx', item.x);
  fog.setAttribute('cy', item.y);
  fog.setAttribute('r', '58');
  fog.setAttribute('class', 'fog');
  fog.setAttribute('id', `fog-${item.id}`);
  fogGroup.appendChild(fog);
});

// POI 点击处理
function onPoiClick(item) {
  if (!unlockedSet.has(item.id)) {
    unlockPoi(item);
  }
  // 延迟显示弹窗，让解锁动画先播放
  setTimeout(() => showModal(item), unlockedSet.has(item.id) ? 0 : 400);
}

// 解锁 POI
function unlockPoi(item) {
  unlockedSet.add(item.id);
  const g = document.getElementById(`poi-${item.id}`);
  g.classList.remove('poi-locked');
  // 显示脉冲
  g.querySelector('.poi-pulse').style.display = '';
  // 散雾
  const fog = document.getElementById(`fog-${item.id}`);
  fog.classList.add('cleared');

  // 爆发光环
  const burst = document.createElementNS(SVG_NS, 'circle');
  burst.setAttribute('cx', 0);
  burst.setAttribute('cy', 0);
  burst.setAttribute('class', 'unlock-burst');
  burst.setAttribute('r', 20);
  g.insertBefore(burst, g.firstChild);
  setTimeout(() => burst.remove(), 1000);

  // 粒子
  for (let i = 0; i < 8; i++) {
    const p = document.createElementNS(SVG_NS, 'circle');
    const angle = (Math.PI * 2 * i) / 8;
    p.setAttribute('cx', 0); p.setAttribute('cy', 0);
    p.setAttribute('r', 2);
    p.setAttribute('fill', '#ffd98a');
    p.style.filter = 'blur(0.5px)';
    g.appendChild(p);
    const dx = Math.cos(angle) * 42;
    const dy = Math.sin(angle) * 42;
    p.animate([
      { transform: 'translate(0,0)', opacity: 1 },
      { transform: `translate(${dx}px, ${dy}px)`, opacity: 0 }
    ], { duration: 800, easing: 'cubic-bezier(0.25, 0.8, 0.35, 1)' });
    setTimeout(() => p.remove(), 800);
  }

  // 成就提示
  showAchievement(item.name);
  updateProgress();
}

// 成就提示
let toastTimer = null;
function showAchievement(name) {
  const toast = document.getElementById('achToast');
  document.getElementById('achName').textContent = name;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
}

// 显示详情
function showModal(item) {
  document.getElementById('modalIcon').textContent = item.icon;
  document.getElementById('modalTitle').textContent = item.name;
  document.getElementById('modalSubtitle').textContent = item.subtitle;
  document.getElementById('modalBody').innerHTML = item.body;
  document.getElementById('modalBackdrop').classList.add('show');
}
function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('show');
}
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalBackdrop').addEventListener('click', (e) => {
  if (e.target.id === 'modalBackdrop') closeModal();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

// 进度更新
function updateProgress() {
  const total = DATA.length;
  const current = unlockedSet.size;
  document.getElementById('progressFill').style.width = `${(current / total) * 100}%`;
  document.getElementById('progressText').textContent = `${current} / ${total}`;
}
updateProgress();

/* =========================================================
   地图自适应（SVG viewBox 已经自动缩放，无需平移/缩放交互）
   ========================================================= */

// 加载动画
window.addEventListener('load', () => {
  setTimeout(() => {
    document.getElementById('loading').classList.add('hide');
  }, 800);
});

</script>
