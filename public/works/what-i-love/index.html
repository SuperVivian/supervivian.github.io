<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>喜欢的事物把我包围 · what i love</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loading"><div class="spinner"></div><div>喜欢的事加载中…</div></div>

  <header class="header">
    <h1 class="title">♡ 喜欢的事物把我包围 ♡</h1>
    <p class="subtitle">我喜欢的 100 件小事～</p>
  </header>

  <main class="scene">
    <div class="rays"></div>

    <div class="character-wrap">
      <div class="center-character">
        <div class="char-avatar">
          <div class="char-hair"><div class="bangs"></div></div>
          <div class="char-face">
            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>
            <div class="mouth"></div>
            <div class="blush left-blush"></div>
            <div class="blush right-blush"></div>
          </div>
          <div class="char-body"></div>
        </div>
        <div class="char-glow"></div>
        <div class="char-label">me ✦</div>
      </div>
    </div>

    <div class="bubbles-container"></div>
  </main>

  <footer class="footer">
    <p>被喜欢的事物包围，是世界上最幸福的事 ✦</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
