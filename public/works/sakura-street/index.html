<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>樱花街道</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #87CEEB;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 14px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            pointer-events: none;
        }
    </style>
</head>
<body>
  <div id="loading"><div class="spinner"></div><div>樱花加载中…</div></div>
  <div id="info">樱花街道 - 拖动鼠标旋转视角</div>
  <script type="importmap">
    {
      "imports": {
        "three": "./three.module.js",
        "three/addons/": "./"
      }
    }
  </script>
  <style>
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      color: #fff;
      z-index: 9999;
      transition: opacity 0.5s ease;
      font-family: 'Microsoft YaHei', sans-serif;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #ffb7c5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
    <script type="module" src="main.js"></script>
</body>
</html>
