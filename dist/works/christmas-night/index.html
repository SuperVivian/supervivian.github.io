<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>圣诞夜的小屋 · Christmas Night</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- 顶部场景指示器 -->
<nav class="scene-nav" id="sceneNav">
  <button class="nav-dot active" data-scene="0" title="雪夜门前"><span>1</span></button>
  <button class="nav-dot" data-scene="1" title="温暖客厅"><span>2</span></button>
  <button class="nav-dot" data-scene="2" title="拆礼物"><span>3</span></button>
  <button class="nav-dot" data-scene="3" title="平安夜祝福"><span>4</span></button>
</nav>

<!-- 背景雪花 canvas（全局常驻） -->
<canvas id="snowCanvas"></canvas>

<!-- ==================== 场景一：雪夜门前 ==================== -->
<section class="scene scene-1 active" id="scene-1">
  <div class="night-sky">
    <div class="moon"></div>
    <div class="stars"></div>
  </div>

  <div class="ground"></div>

  <!-- SVG 小屋 -->
  <div class="cabin-wrap">
    <svg class="cabin" viewBox="0 0 400 380" xmlns="http://www.w3.org/2000/svg">
      <!-- 屋顶积雪阴影 -->
      <polygon points="60,180 200,70 340,180" fill="#8b3a3a"/>
      <polygon points="60,180 200,70 340,180" fill="url(#roofSnow)"/>
      <defs>
        <linearGradient id="roofSnow" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="windowGlow">
          <stop offset="0" stop-color="#ffe28a"/>
          <stop offset="1" stop-color="#ff9a3c"/>
        </radialGradient>
      </defs>

      <!-- 屋身 -->
      <rect x="90" y="180" width="220" height="170" fill="#b54a3a"/>
      <!-- 木纹 -->
      <line x1="90" y1="220" x2="310" y2="220" stroke="#8f3628" stroke-width="2"/>
      <line x1="90" y1="260" x2="310" y2="260" stroke="#8f3628" stroke-width="2"/>
      <line x1="90" y1="300" x2="310" y2="300" stroke="#8f3628" stroke-width="2"/>

      <!-- 窗户 -->
      <rect x="115" y="210" width="55" height="55" fill="url(#windowGlow)" rx="4"/>
      <line x1="142" y1="210" x2="142" y2="265" stroke="#5a2a1e" stroke-width="2"/>
      <line x1="115" y1="237" x2="170" y2="237" stroke="#5a2a1e" stroke-width="2"/>

      <rect x="230" y="210" width="55" height="55" fill="url(#windowGlow)" rx="4"/>
      <line x1="257" y1="210" x2="257" y2="265" stroke="#5a2a1e" stroke-width="2"/>
      <line x1="230" y1="237" x2="285" y2="237" stroke="#5a2a1e" stroke-width="2"/>

      <!-- 门 -->
      <g class="door-group" id="doorGroup">
        <rect x="175" y="275" width="60" height="75" fill="#5a2a1e" rx="4"/>
        <rect x="180" y="280" width="50" height="65" fill="#7a3a2a" rx="3"/>
        <!-- 花环 -->
        <circle cx="205" cy="300" r="14" fill="none" stroke="#2d6a3e" stroke-width="5"/>
        <circle cx="199" cy="295" r="2.5" fill="#d33"/>
        <circle cx="212" cy="298" r="2.5" fill="#d33"/>
        <circle cx="205" cy="314" r="2.5" fill="#d33"/>
        <rect x="202" y="312" width="6" height="6" fill="#ffd93d"/>
        <!-- 门把手 -->
        <circle class="door-knob" cx="222" cy="315" r="3" fill="#ffd93d"/>
      </g>

      <!-- 烟囱 -->
      <rect x="250" y="110" width="30" height="50" fill="#8b3a3a"/>
      <rect x="246" y="105" width="38" height="10" fill="#fff"/>

      <!-- 地面积雪 -->
      <ellipse cx="200" cy="355" rx="200" ry="18" fill="#fff" opacity="0.8"/>
    </svg>

    <!-- 烟囱烟雾 -->
    <div class="smoke">
      <span></span><span></span><span></span>
    </div>

    <!-- 点击提示 -->
    <div class="hint-tip" id="doorHint">
      <span>点击门把手，推门而入 →</span>
    </div>
  </div>

  <!-- 松树剪影 -->
  <div class="pines">
    <svg viewBox="0 0 1200 200" preserveAspectRatio="none">
      <polygon points="100,200 130,80 160,200" fill="#1a3a2a"/>
      <polygon points="200,200 240,50 280,200" fill="#1a3a2a"/>
      <polygon points="900,200 940,60 980,200" fill="#1a3a2a"/>
      <polygon points="1050,200 1080,90 1110,200" fill="#1a3a2a"/>
    </svg>
  </div>

  <div class="scene-title">
    <h1>圣诞夜</h1>
    <p>一间小屋，等着你推门</p>
  </div>
</section>

<!-- ==================== 场景二：温暖客厅 ==================== -->
<section class="scene scene-2" id="scene-2">
  <div class="room">
    <!-- 墙面 -->
    <div class="wall"></div>
    <div class="floor"></div>

    <!-- 壁炉 -->
    <div class="fireplace">
      <div class="fireplace-frame">
        <canvas id="fireCanvas" width="180" height="140"></canvas>
        <div class="logs"></div>
      </div>
      <div class="mantel"></div>
      <div class="stockings">
        <div class="stocking red"></div>
        <div class="stocking green"></div>
      </div>
      <button class="add-log-btn" id="addLogBtn">🪵 添柴</button>
    </div>

    <!-- 圣诞树 -->
    <div class="tree-area">
      <svg class="xmas-tree" viewBox="0 0 220 320" id="xmasTree">
        <defs>
          <linearGradient id="treeGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#4aa564"/>
            <stop offset="1" stop-color="#1f5a33"/>
          </linearGradient>
        </defs>
        <!-- 树干 -->
        <rect x="98" y="275" width="24" height="35" fill="#5a3a20"/>
        <!-- 三层树冠 -->
        <polygon points="110,40 60,140 160,140" fill="url(#treeGrad)"/>
        <polygon points="110,100 45,200 175,200" fill="url(#treeGrad)"/>
        <polygon points="110,160 30,280 190,280" fill="url(#treeGrad)"/>
        <!-- 顶端星星 -->
        <polygon class="tree-star" points="110,20 114,32 127,32 116,40 120,52 110,44 100,52 104,40 93,32 106,32"
                 fill="#ffd93d" stroke="#ffb800" stroke-width="1"/>

        <!-- 彩灯组（可开关） -->
        <g id="treeLights" class="tree-lights on">
          <circle cx="95" cy="80" r="3.5" class="light c1"/>
          <circle cx="125" cy="105" r="3.5" class="light c2"/>
          <circle cx="75" cy="140" r="3.5" class="light c3"/>
          <circle cx="145" cy="150" r="3.5" class="light c4"/>
          <circle cx="100" cy="175" r="3.5" class="light c1"/>
          <circle cx="60" cy="210" r="3.5" class="light c2"/>
          <circle cx="155" cy="215" r="3.5" class="light c3"/>
          <circle cx="110" cy="230" r="3.5" class="light c4"/>
          <circle cx="85" cy="255" r="3.5" class="light c1"/>
          <circle cx="140" cy="260" r="3.5" class="light c2"/>
          <circle cx="45" cy="265" r="3.5" class="light c3"/>
          <circle cx="175" cy="265" r="3.5" class="light c4"/>
        </g>

        <!-- 已挂装饰的容器 -->
        <g id="hungOrnaments"></g>
      </svg>

      <!-- 礼物堆 -->
      <div class="gifts-pile">
        <div class="gift gift-sm" style="background:#d32f2f"></div>
        <div class="gift gift-md" style="background:#2e7d32"></div>
        <div class="gift gift-sm" style="background:#1976d2"></div>
      </div>
    </div>

    <!-- 装饰素材盘（可拖拽到树上） -->
    <div class="ornaments-tray">
      <div class="tray-title">拖我到树上 🎄</div>
      <div class="ornament" draggable="true" data-type="ball-red">🔴</div>
      <div class="ornament" draggable="true" data-type="ball-gold">🟡</div>
      <div class="ornament" draggable="true" data-type="ball-blue">🔵</div>
      <div class="ornament" draggable="true" data-type="star">⭐</div>
      <div class="ornament" draggable="true" data-type="candy">🍬</div>
      <div class="ornament" draggable="true" data-type="bell">🔔</div>
    </div>

    <!-- 操作按钮 -->
    <div class="room-controls">
      <button id="toggleLights">💡 关掉彩灯</button>
      <button id="clearOrnaments">🔄 清空装饰</button>
    </div>

    <div class="scene-tip">点击壁炉添柴 · 拖拽装饰圣诞树 · 开关彩灯</div>
  </div>
</section>

<!-- ==================== 场景三：拆礼物 ==================== -->
<section class="scene scene-3" id="scene-3">
  <div class="gifts-bg"></div>
  <div class="gifts-header">
    <h2>🎁 拆开你的圣诞礼物</h2>
    <p>点击任意礼物盒，看看里面藏着什么</p>
  </div>
  <div class="gifts-grid" id="giftsGrid">
    <!-- JS 动态生成 -->
  </div>
  <div class="gift-popup" id="giftPopup">
    <div class="popup-inner">
      <div class="popup-icon" id="popupIcon">✨</div>
      <div class="popup-msg" id="popupMsg">祝福语</div>
      <button id="popupClose">收下这份心意</button>
    </div>
  </div>
</section>

<!-- ==================== 场景四：平安夜祝福 ==================== -->
<section class="scene scene-4" id="scene-4">
  <canvas id="fireworksCanvas"></canvas>
  <div class="final-content">
    <h1 class="final-title">Merry Christmas</h1>
    <p class="final-sub">愿你被温柔以待，被爱意环绕</p>
    <p class="final-sign">— 来自这间小屋的祝福 —</p>
    <button class="restart-btn" id="restartBtn">🔄 再来一次</button>
  </div>
</section>

<script src="main.js"></script>
</body>
</html>
