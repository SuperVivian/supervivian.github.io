<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#faf8f5"/>

  <!-- 装饰性几何图形 -->
  <circle cx="650" cy="100" r="60" fill="none" stroke="#2d3436" stroke-width="2"/>
  <circle cx="680" cy="130" r="30" fill="none" stroke="#2d3436" stroke-width="2"/>

  <rect x="80" y="450" width="80" height="80" fill="none" stroke="#2d3436" stroke-width="2" transform="rotate(15 120 490)"/>

  <polygon points="700,400 750,500 650,500" fill="none" stroke="#2d3436" stroke-width="2"/>

  <!-- 装饰线 -->
  <line x1="300" y1="200" x2="500" y2="200" stroke="#2d3436" stroke-width="2"/>

  <!-- 卡片示意 -->
  <g transform="translate(150, 250)">
    <rect width="200" height="140" rx="8" fill="white" stroke="#2d3436" stroke-width="2"/>
    <rect x="20" y="20" width="160" height="70" rx="4" fill="#ffeaa7"/>
    <line x1="20" y1="110" x2="100" y2="110" stroke="#2d3436" stroke-width="2"/>
    <line x1="20" y1="120" x2="140" y2="120" stroke="#636e72" stroke-width="1"/>
  </g>

  <g transform="translate(400, 250)">
    <rect width="200" height="140" rx="8" fill="white" stroke="#2d3436" stroke-width="2"/>
    <rect x="20" y="20" width="160" height="70" rx="4" fill="#81ecec"/>
    <line x1="20" y1="110" x2="100" y2="110" stroke="#2d3436" stroke-width="2"/>
    <line x1="20" y1="120" x2="140" y2="120" stroke="#636e72" stroke-width="1"/>
  </g>

  <!-- 小装饰点 -->
  <circle cx="120" cy="150" r="4" fill="#2d3436"/>
  <circle cx="140" cy="170" r="4" fill="#2d3436"/>
  <circle cx="160" cy="150" r="4" fill="#2d3436"/>
</svg>
